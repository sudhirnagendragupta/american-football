      function buildStepHeader(stepNum, title) {
        const dots = STEP_ORDER.map((_, idx) => {
          const cls =
            idx + 1 === stepNum ? "active" : idx + 1 < stepNum ? "done" : "";
          return `<span class="progress-dot ${cls}"></span>`;
        }).join("");

        return `
          <div class="step-header-row">
            <span class="module-tag">Step ${stepNum} of 6 • Beginner Path</span>
            <div class="progress-dots">${dots}</div>
          </div>
          <h2 class="panel-title">${title}</h2>
        `;
      }

      function buildStepFooter(stepNum) {
        const prevDisabled = stepNum === 1 ? "disabled" : "";
        const nextLabel =
          stepNum < 6
            ? `Next: ${
                [
                  "",
                  "What is a Play? →",
                  "The 4-Tries Rule →",
                  "How You Score →",
                  "Player Jobs →",
                  "Play a Live Drive! →",
                ][stepNum]
              }`
            : "Restart Tour ↺";

        return `
          <div class="step-nav-footer">
            <button class="step-nav-btn" id="prev-step-btn" ${prevDisabled}>← Back</button>
            <button class="step-nav-btn primary" id="next-step-btn">${nextLabel}</button>
          </div>
        `;
      }

      function attachStepFooterListeners(stepNum) {
        const prevBtn = document.getElementById("prev-step-btn");
        const nextBtn = document.getElementById("next-step-btn");
        if (prevBtn && stepNum > 1) {
          prevBtn.addEventListener("click", () =>
            switchToTab(STEP_ORDER[stepNum - 2]),
          );
        }
        if (nextBtn) {
          nextBtn.addEventListener("click", () => {
            if (stepNum < 6) switchToTab(STEP_ORDER[stepNum]);
            else switchToTab("step1");
          });
        }
      }

      function buildDownTrackerHTML() {
        const dist =
          gameState.firstDownX >= 50
            ? "End Zone"
            : `${Math.max(1, Math.round(gameState.firstDownX - gameState.losX))} yds needed`;
        const pills = [1, 2, 3, 4]
          .map((d) => {
            const cls =
              d < gameState.down
                ? "used"
                : d === gameState.down
                  ? "current"
                  : "";
            return `<div class="down-pill ${cls}">Try #${d}</div>`;
          })
          .join("");
        return `
          <div class="down-dots-box">
            <div class="down-dots-header">
              <span>YOUR 4 TRIES ("DOWNS")</span>
              <span>Target: ${dist}</span>
            </div>
            <div class="down-pills-row">${pills}</div>
          </div>
        `;
      }

        if (gameState.activeTab !== "step6") {
          playControlsEl.classList.remove("visible");

        playControlsEl.classList.add("visible");

          playControlsEl.innerHTML = `

            </button>

          const kickDist = Math.round(50 - gameState.losX + 17);
          const isFourth = gameState.down === 4;
          const inFgRange = gameState.losX >= 12;

          const recRun = !isFourth && gameState.down === 1;
          const recShort =
            !isFourth && (gameState.down === 2 || gameState.down === 3);
          const recFg = isFourth && inFgRange;
          const recPunt = isFourth && !inFgRange;

          playControlsEl.innerHTML = `
            <button class="play-btn ${recRun ? "recommended" : ""}" data-play="run">

            runSimulatedPlay(playType);

              <p>${pData.details}</p>
            </div>
            <p class="hint-footer">Tip: Click any 3D player on the grass to inspect their job!</p>
            ${buildStepFooter(5)}
          `;

          attachStepFooterListeners(5);

          sidePanel.querySelectorAll(".layer-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              gameState.playerLayerFilter = btn.dataset.layer;
              if (btn.dataset.layer === "wall")
                selectPositionGroup("OL");
              else if (btn.dataset.layer === "skill")
                selectPositionGroup("QB");
              else if (btn.dataset.layer === "outside")
                selectPositionGroup("WR");
              else renderPanel();
            });
          });

          sidePanel.querySelectorAll(".pos-pill").forEach((btn) => {
            btn.addEventListener("click", () => {
              const posKey = btn.dataset.pos;
              const targetLayer = POSITIONS_DATA[posKey].layer;
              if (
                gameState.playerLayerFilter !== "all" &&
                gameState.playerLayerFilter !== targetLayer
              ) {
                gameState.playerLayerFilter = "all";
              }
              selectPositionGroup(posKey);
            });
          });
        }

        // =====================================================================
        // STEP 6: PUT IT ALL TOGETHER — FULL LIVE DRIVE + TV SCOREBUG DECODER
        // =====================================================================
        else if (tab === "step6") {
          setZoneHighlight(false);
          clearPlayerHighlights();
          sidePanel.innerHTML = `
            ${buildStepHeader(6, "You're the Coach: Call a Live Drive!")}
            <div class="coach-box">
              <strong>Coach's Headset</strong>
              ${gameState.coachMessage}
            </div>
            ${buildDownTrackerHTML()}
            <div class="info-grid">
              <div class="info-card" style="cursor:default;">
                <div class="info-card-header">
                  <span class="info-card-title">How to Read the TV Scorebar Below</span>
                  <span class="badge badge-blue">TV DECODER</span>
                </div>
                <p>When TV says <strong>"2ND & 6"</strong>, it simply means: <strong>Try #2 of 4, and you need 6 more yards</strong> to reach the Yellow Line! Look at our live plain-English translation right inside the bottom scoreboard.</p>
              </div>
              <div class="info-card" id="throw-flag-card">
                <div class="info-card-header">
                  <span class="info-card-title">What is a Yellow Penalty Flag?</span>
                  <span class="badge badge-gold">FOUL MARKER</span>
                </div>
                <p>If a player breaks a rule (like jumping across the Blue Line early or grabbing a jersey), referees toss a weighted yellow cloth onto the turf and move the ball back 5–10 yards.</p>
                <span class="action-demo-btn">▶ Toss a Penalty Flag in 3D</span>
              </div>
            </div>
            <button class="tab-btn" id="jump-redzone-btn" style="width:100%; margin-top:10px; background:rgba(250,204,21,0.16); color:#fde047; border-color:rgba(250,204,21,0.4);">
              Skip Ahead to "1st & Goal" (8 Yards from Touchdown!)
            </button>
            ${buildStepFooter(6)}
          `;

          attachStepFooterListeners(6);

          document
            .getElementById("throw-flag-card")
            .addEventListener("click", () => {
              penaltyFlag.visible = true;
              penaltyFlag.position.set(gameState.losX + 2, 12, 3);
              showBanner(
                "FLAG ON THE PLAY!",
                "Referees drop a yellow cloth where a foul happened (e.g., jumping across the Blue Line early = 5-yard penalty).",
                3000,
              );
            });

          document
            .getElementById("jump-redzone-btn")
            .addEventListener("click", () => {
              gameState.losX = 42;
              gameState.firstDownX = 50;
              gameState.down = 1;
              gameState.awaitingConversion = false;
              gameState.coachMessage =
                'Look at the bottom scoreboard: it says "1ST & GOAL"! Because the Red End Zone is only 8 yards away, there is no Yellow 10-yard line—your target IS the End Zone!';
              resetFormationToLOS();
              flyCameraTo([28, 18, 28], [48, 0, 0]);
              renderPanel();
            });
        }
      }

      // Top Navigation Tab Switcher
      function switchToTab(tabId) {
        document
          .querySelectorAll(".tab-btn[data-tab]")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.tab === tabId),
          );
        gameState.activeTab = tabId;
        penaltyFlag.visible = false;
        setZoneHighlight(false);

        if (tabId === "step1") {
          gameState.losX = -25;
          resetFormationToLOS();
          applyCameraPreset("overview");
        } else if (tabId === "step2") {
          gameState.losX = -15;
          resetFormationToLOS();
          flyCameraTo([-26, 17, 25], [-19, 1, 0], 750);
        } else if (tabId === "step3") {
          startFreshDrive(-25);
          applyCameraPreset("broadcast");
        } else if (tabId === "step4") {
          gameState.losX = 40;
          resetFormationToLOS();
          flyCameraTo([24, 18, 28], [52, 2, 0], 750);
        } else if (tabId === "step5") {
          gameState.losX = -15;
          resetFormationToLOS();
          selectPositionGroup(gameState.selectedPosGroup);
        } else if (tabId === "step6") {
          startFreshDrive(-25);
          applyCameraPreset("broadcast");
        }
        renderPanel();
      }

      document.querySelectorAll(".tab-btn[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => switchToTab(btn.dataset.tab));
      });

      // Click 3D Player to Inspect Role
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let pointerDownPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener("pointerdown", (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener("pointerup", (e) => {
        if (
          Math.hypot(
            e.clientX - pointerDownPos.x,
            e.clientY - pointerDownPos.y,
          ) > 5
        )
          return;
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const visibleMeshes = playerMeshes.filter(
          (m) => m.userData.player && m.userData.player.group.visible,
        );
        const hits = raycaster.intersectObjects(visibleMeshes);
        if (hits.length > 0 && hits[0].object.userData.player) {
          const roleKey = hits[0].object.userData.player.roleKey;
          if (gameState.activeTab !== "step5") {
            switchToTab("step5");
          }
          selectPositionGroup(roleKey);
        }
      });

      // =========================================================================
      // 10. 2D PROJECTION & MAIN ANIMATION LOOP
      // =========================================================================
      function projectToScreen(vec3, el) {
        const projected = vec3.clone().project(camera);
        if (projected.z > 1) {
          el.style.opacity = "0";
          return;
        }
        const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
        el.style.opacity = "1";
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
      }

      function animate(now) {
        requestAnimationFrame(animate);

        // Pulse the ball beacon so beginners never lose track of the football
        ballBeacon.scale.setScalar(1 + Math.sin(now * 0.006) * 0.15);

        // Smooth Camera Flight
        if (camTween) {
          const t = Math.min(1, (now - camTween.startTime) / camTween.duration);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(camTween.startPos, camTween.endPos, ease);
          controls.target.lerpVectors(
            camTween.startTarget,
            camTween.endTarget,
            ease,
          );
          if (t >= 1) camTween = null;
        }

        // Play / Demo Animation Interpolation
        if (activePlayAnim) {
          const p = Math.min(
            1,
            (now - activePlayAnim.startTime) / activePlayAnim.duration,
          );
          const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

          if (activePlayAnim.mode === "step1_march") {
            const bx = THREE.MathUtils.lerp(-40, 54, ease);
            const by = 0.8 + Math.abs(Math.sin(p * Math.PI * 5)) * 2.4;
            ballGroup.position.set(bx, by, 0);
            ballBeacon.position.set(bx, 0.04, 0);
          } else {
            players.forEach((pl) => {
              if (!pl.group.visible) return;
              pl.group.position.lerpVectors(pl.startPos, pl.targetPos, ease);
              pl.group.position.y =
                Math.abs(Math.sin(now * 0.022 + pl.relZ)) *
                0.24 *
                (1 - Math.abs(2 * p - 1));
            });

            const {
              type,
              startX,
              rawDestX,
              carrierEndZ,
              ballArcPeak,
            } = activePlayAnim;

            if (type === "run") {
              if (p < 0.24) {
                ballGroup.position.lerpVectors(
                  new THREE.Vector3(startX - 0.5, 0.4, 0),
                  rbPlayer.group.position
                    .clone()
                    .add(new THREE.Vector3(0, 1.1, 0)),
                  p / 0.24,
                );
              } else {
                ballGroup.position
                  .copy(rbPlayer.group.position)
                  .add(new THREE.Vector3(0.3, 1.1, 0));
              }
            } else if (
              type === "short_pass" ||
              type === "deep_pass" ||
              type === "two_pt"
            ) {
              if (p < 0.28) {
                ballGroup.position
                  .copy(qbPlayer.group.position)
                  .add(new THREE.Vector3(0.3, 1.45, 0));
              } else {
                const airT = (p - 0.28) / 0.72;
                const qbPos = qbPlayer.group.position;
                const endX =
                  activePlayAnim.outcomeType === "incomplete"
                    ? rawDestX + 9
                    : rawDestX;
                const bx = THREE.MathUtils.lerp(qbPos.x, endX, airT);
                const bz = THREE.MathUtils.lerp(0, carrierEndZ, airT);
                const endY =
                  activePlayAnim.outcomeType === "incomplete" ? 0.35 : 1.5;
                const by =
                  THREE.MathUtils.lerp(1.6, endY, airT) +
                  Math.sin(airT * Math.PI) * ballArcPeak;
                ballGroup.position.set(bx, by, bz);
                ballGroup.rotation.x += 0.35;
              }
            } else if (type === "fg" || type === "xp") {
              const kickStart = new THREE.Vector3(startX - 7, 0.4, 0);
              const kickEnd = new THREE.Vector3(63, 6.5, carrierEndZ);
              const bx = THREE.MathUtils.lerp(kickStart.x, kickEnd.x, p);
              const bz = THREE.MathUtils.lerp(0, kickEnd.z, p);
              const by =
                THREE.MathUtils.lerp(0.4, kickEnd.y, p) +
                Math.sin(p * Math.PI) * ballArcPeak;
              ballGroup.position.set(bx, by, bz);
              ballGroup.rotation.z += 0.28;
            } else if (type === "punt") {
              const puntStart = new THREE.Vector3(startX - 10, 1.0, 0);
              const puntEnd = new THREE.Vector3(rawDestX, 0.4, 2);
              const bx = THREE.MathUtils.lerp(puntStart.x, puntEnd.x, p);
              const bz = THREE.MathUtils.lerp(0, puntEnd.z, p);
              const by =
                THREE.MathUtils.lerp(1.0, 0.4, p) +
                Math.sin(p * Math.PI) * ballArcPeak;
              ballGroup.position.set(bx, by, bz);
              ballGroup.rotation.x += 0.25;
            }

            ballBeacon.position.set(
              ballGroup.position.x,
              0.04,
              ballGroup.position.z,
            );
          }

          if (p >= 1) {
            players.forEach((pl) => (pl.group.position.y = 0));
            const finished = activePlayAnim;
            activePlayAnim = null;
            finishPlayResolution(finished);
          }
        }

        // Penalty flag drop
        if (penaltyFlag.visible && penaltyFlag.position.y > 0.48) {
          penaltyFlag.position.y = Math.max(
            0.48,
            penaltyFlag.position.y - 0.38,
          );
          penaltyFlag.rotation.z += 0.15;
        }

        controls.update();

        // Update Floating 3D Labels
        if (losLine.visible) {
          losLabelEl.style.display = "block";
          projectToScreen(
            new THREE.Vector3(losLine.position.x, 0.6, -24),
            losLabelEl,
          );
        } else {
          losLabelEl.style.display = "none";
        }

        if (firstDownLine.visible) {
          fdLabelEl.style.display = "block";
          projectToScreen(
            new THREE.Vector3(firstDownLine.position.x, 0.6, 17),
            fdLabelEl,
          );
        } else {
          fdLabelEl.style.display = "none";
        }

        if (zoneLabelEl.style.display === "block") {
          projectToScreen(
            new THREE.Vector3(zoneHighlight.position.x, 2.2, 0),
            zoneLabelEl,
          );
        }

        if (
          gameState.activeTab === "step2" ||
          gameState.activeTab === "step5"
        ) {
          players.forEach((p) => {
            if (p.group.visible && p.tag.style.display !== "none") {
              projectToScreen(
                p.group.position.clone().add(new THREE.Vector3(0, 2.7, 0)),
                p.tag,
              );
            }
          });
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Initialize on Step 1 (or URL ?tab=stepX parameter)
      const urlParams = new URLSearchParams(window.location.search);
      const initialTabParam = urlParams.get("tab");
      if (initialTabParam && STEP_ORDER.includes(initialTabParam)) {
        switchToTab(initialTabParam);
      } else {
        resetFormationToLOS();
        renderPanel();
        applyCameraPreset("overview");
      }
      if (camTween && urlParams.has("tab")) {
        camera.position.copy(camTween.endPos);
        controls.target.copy(camTween.endTarget);
        camTween = null;
      }
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
